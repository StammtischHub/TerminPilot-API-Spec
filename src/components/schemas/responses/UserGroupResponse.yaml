description: User group information
type: object
required:
  - id
  - name
  - members
properties:
  id:
    type: integer
    format: int64
    description: The unique identifier of the user group
  name:
    type: string
    description: The name of the group
  members:
    type: array
    items:
      $ref: '../User.yaml'
    description: The list of users that are members of the group
