description: User group information
type: object
required:
  - id
  - name
  - creator
  - members
properties:
  id:
    $ref: '../EntityId.yaml'
  name:
    type: string
    description: The name of the group
  creator:
    $ref: '../User.yaml'
    description: The user that created the group
  members:
    type: array
    items:
      $ref: '../User.yaml'
    description: The list of users that are members of the group
