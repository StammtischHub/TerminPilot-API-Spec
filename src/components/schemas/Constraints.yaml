type: object
required: [weekdays, dateRange, timeRange, durationMinutes]
properties:
  weekdays:
    type: array
    minItems: 1
    items:
      $ref: './Weekday.yaml'
  dateRange:
    $ref: './DateRange.yaml'
  timeRange:
    $ref: './TimeRange.yaml'
  durationMinutes:
    type: integer
    minimum: 1
    example: 30
