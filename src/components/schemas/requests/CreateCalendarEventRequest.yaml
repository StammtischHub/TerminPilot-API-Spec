description: Request payload for creating a calendar event in an external calendar
type: object
required:
  - title
  - start
  - end
properties:
  title:
    type: string
    minLength: 1
    description: Non-empty event title
  start:
    type: string
    format: date-time
    description: ISO-8601 start timestamp, must be before end
  end:
    type: string
    format: date-time
    description: ISO-8601 end timestamp, must be after start
