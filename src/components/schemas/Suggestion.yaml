type: object
required: [start, end, coverage]
properties:
  start:
    type: string
    format: date-time
    description: Suggested start time
    example: "2026-08-12T14:00:00"
  end:
    type: string
    format: date-time
    description: Suggested end time
    example: "2026-08-12T14:30:00"
  coverage:
    $ref: './Coverage.yaml'
