type: object
required: [totalParticipants, availableParticipantIds, missingParticipantIds]
properties:
  totalParticipants:
    type: integer
    minimum: 1
    example: 3
  availableParticipantIds:
    type: array
    items:
      type: integer
      format: int64
    example: [12, 34, 56]
  missingParticipantIds:
    type: array
    items:
      type: integer
      format: int64
    example: []
    description: Participants not available at this slot; empty array for a full match
