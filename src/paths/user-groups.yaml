post:
  tags:
    - User Groups
  summary: Create a new user group
  operationId: createUserGroup
  security:
    - session-cookie: []
      csrf-header: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/requests/CreateUserGroupRequest.yaml'
  responses:
    '201':
      description: User group created successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/UserGroupResponse.yaml'
    '400':
      description: Invalid user group data provided
    '409':
      description: User group name is already in use by the creator
