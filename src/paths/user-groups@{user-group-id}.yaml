delete:
  tags:
    - User Groups
  summary: Delete a user group by its ID
  operationId: deleteUserGroup
  security:
    - session-cookie: []
      csrf-header: []
  parameters:
    - $ref: '../components/parameters/user-group-id.yaml'
  responses:
    '204':
      description: User group deleted successfully

patch:
  tags:
    - User Groups
  summary: Update a user group by its ID
  operationId: updateUserGroup
  security:
    - session-cookie: []
      csrf-header: []
  parameters:
    - $ref: '../components/parameters/user-group-id.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/requests/UpdateUserGroupRequest.yaml'
  responses:
    '200':
      description: User group updated successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/UserGroupResponse.yaml'
