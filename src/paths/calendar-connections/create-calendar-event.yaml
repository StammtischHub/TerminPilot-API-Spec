post:
  tags:
    - Calendar Connections
  summary: Create an event in a connected external calendar
  operationId: createCalendarEvent
  parameters:
    - name: connectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The connection identifier
    - name: calendarId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The external calendar identifier
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/requests/CreateCalendarEventRequest.yaml'
  responses:
    '201':
      description: Event created successfully
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/responses/CreateCalendarEventResponse.yaml'
    '400':
      description: Invalid request payload
    '401':
      description: Not authenticated
    '403':
      description: Access denied to this calendar connection
    '404':
      description: Calendar connection or calendar not found
    '409':
      description: Calendar or resource conflict reported by Apple CalDAV
    '503':
      description: Apple CalDAV service currently unavailable
